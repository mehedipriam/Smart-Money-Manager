# Serves the React SPA and reverse-proxies /api to the backend container by its Docker
# Compose service name, so the browser only ever talks to this one origin — no CORS
# involved for normal use, and the backend's actual host/port stays an internal detail.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing (React Router): any path that isn't a real static file
    # falls back to index.html so deep links (e.g. /transactions) work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
