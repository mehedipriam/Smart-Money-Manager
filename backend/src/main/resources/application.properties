spring.application.name=backend

# Active profile is selected via SPRING_PROFILES_ACTIVE (defaults to dev for local development)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}

# JWT (values are supplied per-profile / via environment variables; see application-dev/prod.properties)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Frontend URL, used for CORS and links in emails (verification/reset)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
