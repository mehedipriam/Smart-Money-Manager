spring.application.name=backend

# Active profile is selected via SPRING_PROFILES_ACTIVE (defaults to dev for local development)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}

# JWT (values are supplied per-profile / via environment variables; see application-dev/prod.properties)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Frontend URL, used for CORS and links in emails (verification/reset)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Cron schedule for generating due recurring transactions (default: daily at 00:05).
# Override for testing, e.g. "*/10 * * * * *" to run every 10 seconds.
app.scheduler.recurring-transactions-cron=${RECURRING_TRANSACTIONS_CRON:0 5 0 * * *}

# Cron schedule for sending bill due-date reminders (default: daily at 00:10).
app.scheduler.bill-reminders-cron=${BILL_REMINDERS_CRON:0 10 0 * * *}

# Optional seeded admin account for the Admin Panel (Phase 13). Blank by default here — no admin
# is seeded unless ADMIN_EMAIL/ADMIN_PASSWORD are set explicitly (see application-dev.properties
# for a local fallback).
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_FULL_NAME:System Admin}
