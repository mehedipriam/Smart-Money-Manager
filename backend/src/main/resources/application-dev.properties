# ================= DEV PROFILE =================
# Local development defaults. Override any of these via environment variables
# (or a local .env consumed by docker-compose) rather than editing this file.

# Dev-only fallback signing key so the app boots without extra setup. Never reuse this value
# outside local development — application-prod.properties requires JWT_SECRET to be set explicitly.
app.jwt.secret=${JWT_SECRET:dev-local-only-secret-key-change-before-prod-6f9a3e21b7d84c5e9f0a1b2c3d4e5f60}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_money_manager}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema is managed by Hibernate during Phase 2 (full schema creation from JPA entities).
# After Phase 2 is complete and verified, this should move to "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Mail (dev: point at a local/dummy SMTP such as MailHog, or fill in real test credentials)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

logging.level.com.smartmoneymanager.backend=DEBUG
logging.level.org.springframework.security=DEBUG
