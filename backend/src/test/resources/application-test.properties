# ================= TEST PROFILE =================
# In-memory H2 (MySQL compatibility mode) so integration tests never need a real MySQL
# instance running. Schema is created fresh for every test run.

# NON_KEYWORDS: H2 normally reserves YEAR/MONTH as function/keyword names, which the real schema
# uses as plain column names (budgets.year, budgets.month) — legal in MySQL, so this only
# un-reserves them for H2's benefit; it changes nothing about the real MySQL schema.
spring.datasource.url=jdbc:h2:mem:smm-test-${random.uuid};DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=YEAR,MONTH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Fixed test-only signing key — never used outside this profile.
app.jwt.secret=test-only-signing-key-not-for-any-real-environment-0123456789abcdef
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000

app.frontend-url=http://localhost:5173

# No SMTP server in tests; EmailServiceImpl already swallows send failures, so
# these just need to exist and point somewhere unreachable.
spring.mail.host=localhost
spring.mail.port=3025

# No admin account seeded by default — tests that need one create it explicitly.
app.admin.email=
app.admin.password=

logging.level.com.smartmoneymanager.backend=WARN
logging.level.org.springframework.security=WARN
